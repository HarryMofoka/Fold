# CI routing infrastructure for Fold
ci: &ci
  - .github/workflows/build.yml
  - .github/config/.files.yaml

build: &build
  - *ci
  - Taskfile.yml
  - .github/workflows/check-licence.yml
  - package.json
  - package-lock.json

frontend: &frontend
  - *ci
  - src/**
  - public/**
  - scripts/**
  - testing/**
  - package.json
  - package-lock.json
  - vite.config.ts
  - tsconfig.json
  - Taskfile.yml
  - .taskfiles/frontend.yml
  - .taskfiles/e2e.yml
  - .github/workflows/frontend-validation.yml
  - .github/workflows/frontend-a11y.yml
  - .github/workflows/e2e-stubbed.yml

tauri: &tauri
  - *ci
  - src-tauri/**
  - src/desktop/**
  - package.json
  - package-lock.json
  - vite.config.ts
  - .github/workflows/tauri-build.yml
  - Taskfile.yml
  - .taskfiles/desktop.yml

licenses-frontend: &licenses-frontend
  - .github/workflows/frontend-backend-licenses-update.yml
  - package.json
  - package-lock.json
  - scripts/generate-licenses.js
